name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day at midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate the snake SVG
        run: python3 .github/scripts/generate_snake.py ${{ github.repository_owner }} assets/snake.svg

      - name: Commit the updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git diff --quiet --cached || git commit -m "chore: update snake animation"
          git push
