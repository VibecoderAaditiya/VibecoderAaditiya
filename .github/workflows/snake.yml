name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # runs once a day at midnight UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerate whenever you push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: VibecoderAaditiya
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#f0eefc,#c9c2f0,#9b8cf2,#6c63ff,#2f2b6b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD700&color_dots=#161b22,#3b2f6b,#5b4bd6,#8b7cf6,#c9c9f5
            dist/github-contribution-grid-snake.gif?color_snake=#FFD700&color_dots=#161b22,#3b2f6b,#5b4bd6,#8b7cf6,#c9c9f5

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
